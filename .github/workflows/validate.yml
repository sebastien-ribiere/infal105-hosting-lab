name: Verify teaching lab
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python checks
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n scripts/verify.sh scripts/backup_restore.sh
      - name: YAML syntax
        run: |
          python -m pip install pyyaml
          python - <<'PY2'
          from pathlib import Path
          import yaml
          paths = [Path('compose.yaml'), Path('swarm/stack.yaml'), *Path('k8s').glob('*.yaml')]
          for path in paths:
              with path.open() as stream:
                  list(yaml.safe_load_all(stream))
              print('OK:', path)
          PY2
