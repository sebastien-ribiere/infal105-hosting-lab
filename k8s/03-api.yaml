apiVersion: apps/v1
kind: Deployment
metadata:
  name: guildops-api
  namespace: guildops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guildops-api
  template:
    metadata:
      labels:
        app: guildops-api
    spec:
      containers:
        - name: api
          image: guildops-hosting-lab:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: guildops-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guildops-db
                  key: password
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 6
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: guildops-api
  namespace: guildops-lab
spec:
  selector:
    app: guildops-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
